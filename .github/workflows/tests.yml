name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bulletin:
    name: Bulletin pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reliefsociety-bulletin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # the Lambda's runtime
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Lint the CloudFormation template
        run: |
          pip install cfn-lint==1.46.0
          cfn-lint email-to-s3-pipeline.yaml
      - name: Lint deploy.sh
        run: shellcheck deploy.sh

  meals:
    name: Meal sign-up
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reliefsociety-meals
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Unit tests
        run: npm test
